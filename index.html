function highlight(text, keyword) {
  if (!keyword) return text;
  const regex = new RegExp(`(${keyword})`, "g");
  return text.replace(regex, `<span class="highlight">$1</span>`);
}

function searchLaw() {
  const keyword = document.getElementById("keyword").value.trim();
  const lawFilter = document.getElementById("lawFilter").value;
  const resultDiv = document.getElementById("result");
  resultDiv.innerHTML = "";

  if (!keyword) {
    resultDiv.innerHTML = "<p>請輸入關鍵字</p>";
    return;
  }

laws.forEach(law => {

  if (lawFilter !== "all" && law.law !== lawFilter) {
    return;
  }

  if (law.content.includes(keyword)) {
      resultDiv.innerHTML += `
        <p>
          <strong>[${law.law} ${law.article}]</strong><br>
          ${highlight(law.content, keyword)}
        </p>
      `;
    }
  });

if (resultDiv.innerHTML === "") {
  resultDiv.innerHTML = `
    <p style="font-weight: bold; margin-bottom: 32px; color: #8B0000;">
      查無符合條文，請檢查用字或參考上方法規連結。

      </u><br><br>

}
